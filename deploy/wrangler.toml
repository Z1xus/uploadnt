name = "uploadnt"
main = "../crates/lobby/build/worker/shim.mjs"
compatibility_date = "2026-10-01"
routes = [{ pattern = "uploadnt.com", custom_domain = true }]

[build]
command = "cd ../crates/lobby && cargo install -q worker-build@^0.8 && worker-build --release"

[assets]
directory = "../web/build"
not_found_handling = "404-page"
run_worker_first = ["/m/*", "/turn/*", "/stats"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Room"

[[durable_objects.bindings]]
name = "TALLY"
class_name = "Tally"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tally"]

# plan b: TURN_KEY_ID here plus the TURN_KEY_API_TOKEN secret for cloudflare, or TURN_URLS here plus the TURN_SECRET secret for coturn
[vars]
