[workspace]
resolver = "3"
members = ["crates/uploadnt-core", "crates/lobby"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
uploadnt-core = { path = "crates/uploadnt-core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
